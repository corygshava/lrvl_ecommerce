<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>Product Detail</title>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
	<style>
		.product-card {
			border-radius: 12px;
			box-shadow: 0 2px 8px rgba(0,0,0,0.1);
			padding: 20px;
			background: #fff;
		}
		.product-header {
			border-bottom: 1px solid #eee;
			margin-bottom: 15px;
		}
		.measurement-box {
			background: #f8f9fa;
			padding: 15px;
			border-radius: 8px;
		}
	</style>
</head>
<body class="bg-light">

<div class="container my-5">
	<div class="row">
		<div class="col-md-8 offset-md-2 product-card">

			<!-- Header -->
			<div class="product-header text-center mb-4">
				<h2 id="productName">Generics</h2>
				<p class="text-muted" id="productDesc">A stylish piece designed for comfort and elegance.</p>
			</div>

			<!-- Product Info -->
			<div class="row mb-3">
				<div class="col-md-6">
					<ul class="list-group list-group-flush">
						<li class="list-group-item"><strong>Color:</strong> <span id="productColor">Blue</span></li>
						<li class="list-group-item"><strong>Price:</strong> $<span id="productPrice">59.99</span></li>
						<li class="list-group-item"><strong>Material:</strong> <span id="productMaterial">Cotton</span></li>
						<li class="list-group-item"><strong>Sizes Available:</strong> <span id="productSizes">S, M, L, XL</span></li>
					</ul>
				</div>
				<div class="col-md-6">
					<ul class="list-group list-group-flush">
						<li class="list-group-item"><strong>Height (Cloth):</strong> <span id="productHeight">110 cm</span></li>
						<li class="list-group-item"><strong>Stretchiness:</strong> <span id="productStretch">Medium</span></li>
					</ul>
				</div>
			</div>

			<!-- Size Chart Button -->
			<div class="text-center mb-4">
				<button type="button" class="btn btn-primary" data-toggle="modal" data-target="#sizeChartModal">
					View Size Chart
				</button>
			</div>

			<!-- User Measurements -->
			<div class="measurement-box">
				<h5 class="mb-3">Enter Your Measurements</h5>
				<form>
					<div class="form-row">
						<div class="form-group col-md-4">
							<label for="chest">Chest (cm)</label>
							<input type="number" class="form-control" id="chest" placeholder="e.g. 90">
						</div>
						<div class="form-group col-md-4">
							<label for="waist">Waist (cm)</label>
							<input type="number" class="form-control" id="waist" placeholder="e.g. 75">
						</div>
						<div class="form-group col-md-4">
							<label for="hips">Hips (cm)</label>
							<input type="number" class="form-control" id="hips" placeholder="e.g. 95">
						</div>
					</div>
					<button type="submit" class="btn btn-success btn-block">Save Measurements</button>
				</form>
			</div>

		</div>
	</div>
</div>

<!-- Size Chart Modal -->
<div class="modal fade" id="sizeChartModal" tabindex="-1" role="dialog" aria-labelledby="sizeChartLabel" aria-hidden="true">
	<div class="modal-dialog modal-lg" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="sizeChartLabel">Size Chart</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span>&times;</span>
				</button>
			</div>
			<div class="modal-body text-center">
				<img src="sizechart.jpg" alt="Size Chart" class="img-fluid">
			</div>
		</div>
	</div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
