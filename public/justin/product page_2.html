<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Product Details</title>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
	<style>
		.product-images img {
			cursor: pointer;
			border: 2px solid transparent;
		}
		.product-images img:hover {
			border-color: #007bff;
		}
		.main-img {
			width: 100%;
			max-height: 400px;
			object-fit: cover;
			border-radius: 5px;
		}
		.thumb-img {
			height: 80px;
			width: auto;
			object-fit: cover;
			margin-right: 10px;
			border-radius: 5px;
		}
		.measurement-box textarea {
			resize: none;
		}
		.spacy{
			padding: 24px 0;
		}
	</style>
</head>
<body class="bg-light py-4">

<div class="container">
	<div class="row">
		<!-- Left: Images -->
		<div class="col-md-6">
			<div class="mb-3">
				<img id="mainImage" src="main-image.jpg" class="main-img img-fluid shadow-sm" alt="Main Product Image">
			</div>
			<div class="d-flex product-images">
				<img src="main-image.jpg" class="thumb-img" onclick="changeImage(this)">
				<img src="image2.jpg" class="thumb-img" onclick="changeImage(this)">
				<img src="image3.jpg" class="thumb-img" onclick="changeImage(this)">
			</div>
		</div>

		<!-- Right: Details -->
		<div class="col-md-6">
			<h2 class="mb-2">Product Name</h2>
			<p class="text-muted">Short description of the product goes here.</p>
			<h4 class="text-primary mb-3">$49.99</h4>

			<ul class="list-unstyled mb-3">
				<li><strong>Color:</strong> Red</li>
				<li><strong>Material:</strong> Cotton</li>
				<li><strong>Sizes Available:</strong> S, M, L, XL</li>
				<li><strong>Height:</strong> 100 cm</li>
				<li><strong>Stretchiness:</strong> Medium</li>
			</ul>

			<!-- Size chart button -->
			<button class="btn btn-outline-primary mb-3" data-toggle="modal" data-target="#sizeChartModal">
				View Size Chart
			</button>

			<!-- User measurement input -->
			<div class="measurement-box">
				<h5 class="mb-3">Enter Your Measurements</h5>
				<form>
					<div class="form-row">
						<div class="form-group col-md-4">
							<label for="chest">Chest (cm)</label>
							<input type="number" class="form-control" id="chest" placeholder="e.g. 90">
						</div>
						<div class="form-group col-md-4">
							<label for="waist">Waist (cm)</label>
							<input type="number" class="form-control" id="waist" placeholder="e.g. 75">
						</div>
						<div class="form-group col-md-4">
							<label for="hips">Hips (cm)</label>
							<input type="number" class="form-control" id="hips" placeholder="e.g. 95">
						</div>
					</div>
					<button type="submit" class="btn btn-success btn-block">Save Measurements</button>
				</form>
			</div>

			<!-- Add to cart -->
			<div class="spacy">
				<button class="btn btn-success btn-lg">Add to Cart</button>
			</div>
		</div>
	</div>
</div>

<!-- Size Chart Modal -->
<div class="modal fade" id="sizeChartModal" tabindex="-1" role="dialog" aria-labelledby="sizeChartModalLabel" aria-hidden="true">
	<div class="modal-dialog modal-lg" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Size Chart</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span>&times;</span>
				</button>
			</div>
			<div class="modal-body text-center">
				<img src="size-chart.jpg" class="img-fluid" alt="Size Chart">
			</div>
		</div>
	</div>
</div>

<script>
	function changeImage(img) {
		document.getElementById("mainImage").src = img.src;
	}
</script>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
