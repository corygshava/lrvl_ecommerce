<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ladies Size Chart</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .size-chart {
      margin-top: 50px;
    }
    .table th, .table td {
      text-align: center;
      vertical-align: middle;
    }
    h2 {
      margin-bottom: 20px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container size-chart">
  <div class="text-center">
    <h2>Ladies Size Chart</h2>
    <p class="text-muted">Measurements are in centimeters (cm)</p>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-striped table-hover">
      <thead class="thead-dark">
        <tr>
          <th>Size</th>
          <th>US</th>
          <th>UK</th>
          <th>Bust</th>
          <th>Waist</th>
          <th>Hips</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>XS</td>
          <td>2</td>
          <td>6</td>
          <td>78 - 82</td>
          <td>60 - 64</td>
          <td>84 - 88</td>
        </tr>
        <tr>
          <td>S</td>
          <td>4</td>
          <td>8</td>
          <td>83 - 86</td>
          <td>65 - 68</td>
          <td>89 - 92</td>
        </tr>
        <tr>
          <td>M</td>
          <td>6</td>
          <td>10</td>
          <td>87 - 90</td>
          <td>69 - 72</td>
          <td>93 - 96</td>
        </tr>
        <tr>
          <td>L</td>
          <td>8</td>
          <td>12</td>
          <td>91 - 96</td>
          <td>73 - 78</td>
          <td>97 - 102</td>
        </tr>
        <tr>
          <td>XL</td>
          <td>10</td>
          <td>14</td>
          <td>97 - 102</td>
          <td>79 - 84</td>
          <td>103 - 108</td>
        </tr>
        <tr>
          <td>XXL</td>
          <td>12</td>
          <td>16</td>
          <td>103 - 108</td>
          <td>85 - 90</td>
          <td>109 - 114</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

</body>
</html>
